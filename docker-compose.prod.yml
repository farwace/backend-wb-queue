# ----------------------------------------------------------------------------
# PRODUCTION stack for wb-alex (backend-wb-queue) — domain: rwb.h1n.ru
#
# Full Laravel runtime: PHP-FPM + Nginx, PostgreSQL, Redis, queue workers,
# Reverb (WebSocket broadcasting) and the Laravel scheduler.
#
# This file is SEPARATE from docker-compose.yml (which is Laravel Sail / dev).
#
# Usage (run from the repository root):
#   cp .env.prod.example .env        # then fill in real secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm app php artisan migrate --force
#   docker compose -f docker-compose.prod.yml run --rm app php artisan optimize
#
# TLS is terminated by the host nginx (see docker/prod/deploy/rwb.h1n.ru.nginx.conf),
# which proxies https://rwb.h1n.ru -> 127.0.0.1:${APP_PORT}. Nothing except the
# HTTP entrypoint is published to the host, and even that is localhost-only.
# ----------------------------------------------------------------------------

name: rwb-alex-prod

# Shared config for every PHP container (app, queue, reverb, scheduler).
x-php-app: &php-app
  build:
    context: ./docker/prod
    dockerfile: Dockerfile
  image: rwb-alex/app:prod
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - ./:/var/www/html
  networks:
    - rwbnet
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ---- Application server (PHP-FPM) ----
  app:
    <<: *php-app
    expose:
      - "9000"
    # default CMD is php-fpm (from the image)

  # ---- Web gateway (Nginx): serves public/ + proxies /app to Reverb ----
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8088}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/prod/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
      - reverb
    networks:
      - rwbnet

  # ---- Queue worker (Redis driver). Scale: --scale queue=4 ----
  queue:
    <<: *php-app
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=5 --max-time=3600

  # ---- Reverb WebSocket server ----
  reverb:
    <<: *php-app
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    expose:
      - "8080"

  # ---- Laravel scheduler (runs schedule:run every minute in a loop) ----
  scheduler:
    <<: *php-app
    command: php artisan schedule:work

  # ---- PostgreSQL (persistent) ----
  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel}
      POSTGRES_USER: ${DB_USERNAME:-rwb}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgsql-data:/var/lib/postgresql/data
    networks:
      - rwbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rwb} -d ${DB_DATABASE:-laravel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---- Redis (queue / cache / session, AOF persistence) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - rwbnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  rwbnet:
    driver: bridge

volumes:
  pgsql-data:
    driver: local
  redis-data:
    driver: local
