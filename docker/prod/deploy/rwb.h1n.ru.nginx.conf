# Host nginx vhost for rwb.h1n.ru -> dockerized wb-alex backend.
# Terminates TLS (Let's Encrypt) and proxies to the container stack published
# on 127.0.0.1:8088 (see docker-compose.prod.yml APP_PORT).
# Template (kept under git in docker/prod/deploy/). On the server, copy it to
# /etc/nginx/sites-available/rwb.h1n.ru and symlink into sites-enabled, then
# run: nginx -t && systemctl reload nginx

# HTTP -> HTTPS (+ ACME challenge for certbot)
server {
    listen 80;
    listen [::]:80;
    server_name rwb.h1n.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rwb.h1n.ru;

    ssl_certificate     /etc/letsencrypt/live/rwb.h1n.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rwb.h1n.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100M;

    # Reverb WebSocket (/app, /apps) — must forward the Upgrade handshake.
    location ~ ^/(app|apps) {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Main application
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }
}
