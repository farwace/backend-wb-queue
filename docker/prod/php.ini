[PHP]
; --- resource limits ---
memory_limit = 512M
max_execution_time = 120
post_max_size = 100M
upload_max_filesize = 100M
max_input_time = 120
max_input_vars = 5000

; --- behavior ---
expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
date.timezone = UTC

[opcache]
; Code is bind-mounted and refreshed on deploy; the deploy script restarts the
; PHP-FPM container, so we can safely disable timestamp validation for speed.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.fast_shutdown = 1
realpath_cache_size = 4096K
realpath_cache_ttl = 600
