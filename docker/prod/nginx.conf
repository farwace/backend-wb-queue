# In-container Nginx for production.
# Serves the Laravel app from public/ via PHP-FPM ("app" service on :9000)
# and proxies the Reverb WebSocket on /app to the "reverb" service on :8080.
#
# TLS is expected to be terminated by the HOST nginx (as with the other
# *.wb.h1n.ru vhosts); this server listens on plain :80 and is only published
# to 127.0.0.1:<APP_PORT> by docker-compose.prod.yml.

# Detect "behind HTTPS" from the host proxy so Laravel generates https/secure URLs.
map $http_x_forwarded_proto $fastcgi_https {
    default "";
    "https" "on";
}

server {
    listen 80;
    server_name rwb.h1n.ru _;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 100M;
    charset utf-8;

    # Re-resolve Docker service IPs at runtime. Without this, nginx caches the
    # A-record of "app"/"reverb" at startup; after `docker compose restart app`
    # the container can get a new IP and nginx keeps hitting the stale one -> 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Reverb WebSocket (Pusher protocol: /app, /apps for auth) ----
    location ~ ^/(app|apps) {
        set $reverb_upstream reverb:8080;
        proxy_pass http://$reverb_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- Front controller ----
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $fastcgi_upstream app:9000;
        fastcgi_pass $fastcgi_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $fastcgi_https if_not_empty;
        fastcgi_param SERVER_NAME $http_host;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        client_max_body_size 100M;
    }

    # Static assets served straight from disk
    location ~* \.(?:css|js|woff2?|svg|ttf|eot|otf|ico|png|jpe?g|gif|webp|mp4)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # Never expose dotfiles (except .well-known for certbot)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /var/log/nginx/rwb_error.log warn;
    access_log /var/log/nginx/rwb_access.log;
}
